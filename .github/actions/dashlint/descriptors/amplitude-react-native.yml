# @amplitude/analytics-react-native: the React Native SDK. The default instance's members are
# module-level consts in @amplitude/analytics-react-native 1.13.1 (lib/typescript/index.d.ts,
# container `(module)`); a client from createInstance() is typed by the ReactNativeClient, Client
# and CoreClient interfaces of @amplitude/analytics-core 2.62.1 (lib/esm/types/client/); the
# AmplitudeReactNative class (lib/typescript/react-native-client.d.ts) extends AmplitudeCore.
sdk: amplitude-react-native
package: '@amplitude/analytics-react-native'
versions: '>=1.0.0 <2.0.0'
verified: 1.13.1
declaredIn: ['@amplitude/analytics-react-native', '@amplitude/analytics-core']
platforms: [ios, android]
calls:
  # track(eventInput: string | BaseEvent, eventProperties?, eventOptions?), as in the browser SDK
  # (analytics-core lib/esm/utils/event-builder.js:5, ADR-055).
  - member: track
    on: ['(module)', CoreClient, AmplitudeCore]
    event: args[0]
    properties: args[1]
    objectForm:
      event: args[0].event_type
      properties:
        - args[0].event_properties
        - args[1]
  - member: logEvent
    on: ['(module)', CoreClient, AmplitudeCore]
    event: args[0]
    properties: args[1]
    objectForm:
      event: args[0].event_type
      properties:
        - args[0].event_properties
        - args[1]
  # trackScreenView(screenName, eventProperties?) tracks '[Amplitude] Screen Viewed' with the screen
  # name under '[Amplitude] Screen Name', the given properties spread after it
  # (lib/module/react-native-client.js:390-400). It sends nothing when autocapture.screenViews is
  # false, which is not read in v0.1 (ADR-055).
  - member: trackScreenView
    on: ['(module)', ReactNativeClient, AmplitudeReactNative]
    event: { literal: '[Amplitude] Screen Viewed' }
    addProperties:
      '[Amplitude] Screen Name': args[0]
    properties: args[1]
  # The screen name comes from the navigation state at runtime (react-native-client.js:402-411);
  # '[Amplitude] Screen Name' stays a conditional builtin there.
  - member: trackScreenViewOnNavigationStateChange
    on: ['(module)', ReactNativeClient, AmplitudeReactNative]
    event: { literal: '[Amplitude] Screen Viewed' }
    properties: args[1]
  - member: identify
    on: ['(module)', CoreClient, AmplitudeCore, AmplitudeReactNative]
    identity: identify
  - member: setUserId
    on: ['(module)', Client, AmplitudeReactNative]
    identity: identify
  - member: reset
    on: ['(module)', Client, AmplitudeReactNative]
    identity: reset
  - member: set
    on: [IIdentify, Identify]
    personSet: args[0]
  - member: setOnce
    on: [IIdentify, Identify]
    personSetOnce: args[0]
# init(apiKey, userId?, options?) (analytics-core lib/esm/types/client/react-native-client.d.ts:28).
init:
  - member: init
    on: ['(module)', ReactNativeClient, AmplitudeReactNative]
    options: args[2]
builtins: builtins/amplitude-react-native.yml
stub: stubs/amplitude-react-native.d.ts
unknownNames:
  # $identify, $groupidentify and revenue_amount (analytics-core lib/esm/types/event/event.d.ts:78),
  # and `[Amplitude] ...` names built at runtime (ADR-055).
  events: [$, revenue_amount, '[Amplitude]']
  # Device fields the trackingOptions switch on by default (adid, carrier, os_version, ...) beyond
  # the cited rows, and location fields added on ingestion (ADR-055, partly uncited).
  properties: ['[Amplitude]', adid, carrier, city, region, country, dma, device_, os_]
