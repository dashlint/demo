# Builtins of posthog-js (spec 6.3.3, ADR-003): what the SDK sends by itself, each with the init
# option that switches it, or `unknown` when code cannot decide. Every row is cited to the
# published package source at the descriptor's verified version (V2).
sdk: posthog-js
events:
  - { name: '$autocapture', when: { option: 'autocapture', not: false } }
  - { name: '$pageview', when: { option: 'capture_pageview', not: false } }
  - { name: '$pageleave', when: { option: 'capture_pageleave', not: false } }
  - { name: '$identify', when: { option: 'person_profiles', not: 'never' } }
  - { name: '$set', when: { option: 'person_profiles', not: 'never' } }
  - { name: '$groupidentify', when: { option: 'person_profiles', not: 'never' } }
  - { name: '$create_alias', when: { option: 'person_profiles', not: 'never' } }
  - {
      name: '$opt_in',
      when:
        {
          unknown: 'sent only after the app calls opt_in_capturing(), unless its captureEventName option is null or false',
        },
    }
  - { name: '$exception', when: { option: 'capture_exceptions', is: true } }
  - {
      name: '$web_vitals',
      when:
        {
          unknown: 'default depends on server-side remote-config flag (WEB_VITALS_ENABLED_SERVER_SIDE) unless capture_performance is set client-side',
        },
    }
  - { name: '$rageclick', when: { option: 'rageclick', not: false } }
  - {
      name: '$dead_click',
      when:
        {
          unknown: "capture_dead_clicks client option or the project's remote config; the extension loads lazily",
        },
    }
properties:
  - { name: '$current_url', events: '*', presence: always, when: always }
  - { name: '$host', events: '*', presence: always, when: always }
  - { name: '$pathname', events: '*', presence: always, when: always }
  - { name: '$browser', events: '*', presence: always, when: always }
  - { name: '$browser_version', events: '*', presence: always, when: always }
  - { name: '$os', events: '*', presence: always, when: always }
  - { name: '$os_version', events: '*', presence: always, when: always }
  - { name: '$device_type', events: '*', presence: always, when: always }
  - { name: '$screen_height', events: '*', presence: always, when: always }
  - { name: '$screen_width', events: '*', presence: always, when: always }
  - { name: '$viewport_height', events: '*', presence: always, when: always }
  - { name: '$viewport_width', events: '*', presence: always, when: always }
  - { name: '$raw_user_agent', events: '*', presence: always, when: always }
  - { name: '$lib', events: '*', presence: always, when: always }
  - { name: '$lib_version', events: '*', presence: always, when: always }
  - { name: '$insert_id', events: '*', presence: always, when: always }
  - { name: '$time', events: '*', presence: always, when: always }
  - { name: '$session_id', events: '*', presence: always, when: always }
  - { name: '$window_id', events: '*', presence: always, when: always }
  - { name: '$pageview_id', events: '*', presence: always, when: always }
  - {
      name: '$prev_pageview_pathname',
      events: ['$pageview', '$pageleave'],
      presence: sometimes,
      when:
        {
          unknown: "not option-gated; only present once a previous pageview exists in this session's in-memory state (page-view.js _currentPageview)",
        },
    }
  - {
      name: '$referrer',
      events: '*',
      presence: sometimes,
