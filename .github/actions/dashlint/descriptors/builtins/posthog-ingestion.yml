# What PostHog adds on ingestion, whatever the SDK sends (ADR-012, ADR-029): the GeoIP
# transformation (template-geoip) that every new project gets enabled. A project can disable it,
# and an event without $ip (IP discarding, cookieless mode) or with $geoip_disable skips it, so
# every row is unknown: a tile on these names is not checked, never "never sent". $initial_geoip_*
# person properties fall under the descriptors' $initial_ prefix (ADR-003). Written by
# notes/scripts/t39-write-ingestion.mjs; every name is cited in notes/research/t39-ingestion.md.
sdk: posthog
events: []
properties:
  - name: '$geoip_city_name'
    events: '*'
    presence: sometimes
    when:
      {
        unknown: "added on ingestion by the project's GeoIP transformation, on by default; not added when the project disables it or the event has no $ip or sets $geoip_disable",
      }
